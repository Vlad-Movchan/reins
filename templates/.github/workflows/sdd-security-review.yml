# Managed by specjig. AI security review with the project's rules on top, label-triggered.
# claude-code-security-review accepts only an API key (no workload identity federation yet), so
# this is the one workflow that needs the ANTHROPIC_API_KEY secret. Without it the job skips.
name: sdd / security review
on:
  pull_request:
    types: [labeled, synchronize]
permissions:
  contents: read
  pull-requests: write
jobs:
  security:
    if: contains(github.event.pull_request.labels.*.name, 'security-review')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - if: env.HAS_KEY != 'true'
        run: echo "::notice::Security review needs the ANTHROPIC_API_KEY secret (claude-code-security-review does not support workload identity federation); skipping."
      - if: env.HAS_KEY == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - if: env.HAS_KEY == 'true'
        uses: anthropics/claude-code-security-review@{{SECURITY_REVIEW_ACTION}}
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          comment-pr: true
          custom-security-scan-instructions: .claude/rules/security.md
