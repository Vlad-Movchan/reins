# Managed by reins. AI security review with the project's rules on top, label-triggered.
name: sdd / security review
on:
  pull_request:
    types: [labeled, synchronize]
permissions:
  contents: read
  pull-requests: write
jobs:
  security:
    if: contains(github.event.pull_request.labels.*.name, 'security-review')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: anthropics/claude-code-security-review@{{SECURITY_REVIEW_ACTION}}
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          comment-pr: true
          custom-security-scan-instructions: .claude/rules/security.md
