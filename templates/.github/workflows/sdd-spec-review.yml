# Managed by specjig. Spec-aware review, triggered by the `ai-review` label (cost control).
# Reads the change(s) named in the Change-Id trailers and checks the code against their scenarios.
name: sdd / spec-aware review
on:
  pull_request:
    types: [labeled, synchronize]
permissions:
  contents: read
  pull-requests: write
  id-token: write
concurrency:
  group: sdd-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: contains(github.event.pull_request.labels.*.name, 'ai-review')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: trailers
        run: node .sdd/scripts/check-trailers.mjs "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" || true
      - uses: anthropics/claude-code-action@{{CLAUDE_CODE_ACTION}}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}  PR: ${{ github.event.pull_request.number }}
            Changes referenced by commits: ${{ steps.trailers.outputs.change_ids || 'none found' }}

            Review this PR against its OpenSpec change(s). For each change id, read
            openspec/changes/<id>/ (or openspec/changes/archive/*-<id>/): proposal.md, specs/**,
            tests.md, design.md, impact.md.

            Check:
            1. Every scenario in the delta specs that this PR's layer covers is implemented and has
               the test named in tests.md; the test asserts the scenario's THEN, not a mock.
            2. Code does not do things no requirement asked for (scope creep).
            3. Error behavior and edge cases match the scenarios.
            4. Rules in .claude/rules/security.md (PII/PHI in logs or URLs, authz, tenant isolation).
            5. tasks.md checkboxes match what was actually done.

            Post inline comments with mcp__github_inline_comment__create_inline_comment (confirmed: true)
            only for real problems. Each comment links the requirement:
            `openspec/changes/<id>/specs/<capability>/spec.md` › "Requirement: <name>" › "Scenario: <name>".
            Finish with one summary PR comment: scenarios covered / missing / wrong, as a table.
            If there is no change id, say so in the summary and review against openspec/specs/ only.
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*)"
